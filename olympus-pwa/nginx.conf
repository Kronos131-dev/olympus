# Sert la PWA Olympus sous /olympus et relaie les appels API vers olympus-api
# (même origine -> aucun CORS nécessaire). Les fichiers buildés sont copiés dans
# /usr/share/nginx/html/olympus/ pour que le chemin disque corresponde à l'URL.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API : /olympus/api/... -> http://olympus-api:8080/api/...
    location /olympus/api/ {
        proxy_pass http://olympus-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads (photos du chat) jusqu'à 10 Mo, comme le backend.
        client_max_body_size 10m;
        proxy_read_timeout 120s;
    }

    # Le service worker ne doit jamais être mis en cache durablement.
    location = /olympus/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets fingerprintés : cache long immuable.
    location /olympus/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA : tout chemin /olympus/* retombe sur index.html.
    location /olympus/ {
        try_files $uri $uri/ /olympus/index.html;
    }

    # Redirige la racine vers la PWA.
    location = / {
        return 302 /olympus/;
    }
}
