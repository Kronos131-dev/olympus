# Sert la PWA Olympus à la RACINE de son sous-domaine et relaie les appels API vers
# olympus-api (même origine -> aucun CORS). Le build est monté dans /usr/share/nginx/html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API : /api/... -> http://olympus-api:8080/api/...
    location /api/ {
        proxy_pass http://olympus-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads (photos du chat) jusqu'à 10 Mo, comme le backend.
        client_max_body_size 10m;
        proxy_read_timeout 120s;
    }

    # Le service worker ne doit jamais être mis en cache durablement.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # L'index ne doit pas être figé : revalidation à chaque chargement (sinon l'app
    # installée ne voit jamais la nouvelle version).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets fingerprintés : cache long immuable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icônes / fichiers statiques : cache modéré.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA : tout chemin retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
