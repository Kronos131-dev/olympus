# Compose de PRODUCTION (serveur). L'image vient de GHCR (publiée par le pipeline CI/CD).
# Les secrets sont lus depuis un fichier .env placé à côté de ce fichier sur le serveur :
#   POSTGRES_USER=...
#   POSTGRES_PASSWORD=...
#   MISTRAL_API_KEY=...
#   GEMINI_API_KEY=...
services:

  olympus-api:
    image: ghcr.io/kronos131-dev/olympus:latest
    container_name: olympus-api
    ports:
      # L'app Android attaque le port 8081 ; le conteneur écoute sur 8080.
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://olympus-db:5432/olympus_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-olympus_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-olympus_password}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - olympus-db
    restart: always

  olympus-db:
    image: postgres:16-alpine
    container_name: olympus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olympus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olympus_password}
      POSTGRES_DB: olympus_db
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
