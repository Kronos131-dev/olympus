# Compose de PRODUCTION (serveur), modèle « artefacts montés » — aligné sur Chiron.
# La pipeline Chiron build les artefacts et les dépose, par scp, à côté de ce fichier
# (dans ~/olympus) puis recrée les conteneurs. Aucun build ni image GHCR ici.
#
# Fichiers attendus à côté de ce compose sur le serveur :
#   olympus.jar               -> le JAR backend (target/olympus-0.0.1-SNAPSHOT.jar renommé)
#   olympus-pwa-dist/         -> le build de la PWA (olympus-pwa/dist)
#   olympus-pwa-nginx.conf    -> la conf nginx de la PWA (olympus-pwa/nginx.conf)
#   .env                      -> POSTGRES_USER, POSTGRES_PASSWORD, MISTRAL_API_KEY, GEMINI_API_KEY, ...
services:

  olympus-api:
    image: eclipse-temurin:25-jre-alpine
    container_name: olympus-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://olympus-db:5432/olympus_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Envoi d'emails (mot de passe oublié) — mêmes identifiants Gmail que Chiron.
      - GMAIL_USERNAME=${GMAIL_USERNAME:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      # URL publique de la PWA, pour le lien de réinitialisation dans l'email.
      - FRONTEND_URL=${FRONTEND_URL:-https://olympus.chiron-sanctuaire.fr}
    volumes:
      # Le JAR déposé par la pipeline Chiron (scp).
      - ./olympus.jar:/app/olympus.jar
    command: ["java", "-jar", "/app/olympus.jar"]
    depends_on:
      olympus-db:
        condition: service_healthy
    restart: always
    # `default` : communication interne avec olympus-db.
    # `chiron-olympus` : réseau partagé permettant à chiron-backend d'atteindre
    # olympus-api par son nom de service (http://olympus-api:8080).
    networks:
      - default
      - chiron-olympus

  # Front PWA React servi par nginx (assets montés à la racine), qui relaie aussi /api
  # vers olympus-api (même origine -> pas de CORS). Le reverse-proxy (NPM) de Chiron
  # route le sous-domaine olympus.chiron-sanctuaire.fr vers ce service.
  olympus-pwa:
    image: nginx:1.27-alpine
    container_name: olympus-pwa
    ports:
      - "8082:80"
    volumes:
      - ./olympus-pwa-dist:/usr/share/nginx/html:ro
      - ./olympus-pwa-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - olympus-api
    restart: always
    networks:
      - default
      - chiron-olympus

  olympus-db:
    image: postgres:16-alpine
    container_name: olympus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: olympus_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    # Réseau partagé pour que chiron-backend lise directement la base (nutrition/poids).
    networks:
      - default
      - chiron-olympus

volumes:
  db_data:

networks:
  # Réseau partagé avec la stack Chiron. À créer une fois sur le serveur :
  #   docker network create chiron-olympus
  chiron-olympus:
    external: true
    name: chiron-olympus
