spring:
  application:
    name: olympus

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/olympus_db}
    username: ${SPRING_DATASOURCE_USERNAME:olympus_user}
    password: ${SPRING_DATASOURCE_PASSWORD:olympus_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Keep update for dev
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # On active Flyway pour pouvoir injecter les extensions PostgreSQL
  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    mistralai:
      api-key: ${MISTRAL_API_KEY:}

      chat:
        options:
          model: mistral-small-latest
          temperature: 0.0

  # Taille des uploads (photos envoyées à l'agent IA)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# Configuration de l'agent IA conversationnel
olympus:
  agent:
    mistral-model: ${OLYMPUS_AGENT_MISTRAL_MODEL:mistral-small-latest}
    # Clé d'API Google Gemini (Generative Language API). Vide = Gemini désactivé, Mistral utilisé par défaut.
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${OLYMPUS_AGENT_GEMINI_MODEL:gemini-2.0-flash}
    # Nombre maximum d'allers-retours d'outils par message (limite les appels LLM).
    max-tool-rounds: ${OLYMPUS_AGENT_MAX_TOOL_ROUNDS:3}
    # Cadence et résilience des appels aux API LLM (clé Mistral gratuite ≈ 1 req/s).
    mistral-min-interval-ms: ${OLYMPUS_AGENT_MISTRAL_MIN_INTERVAL_MS:1100}
    gemini-min-interval-ms: ${OLYMPUS_AGENT_GEMINI_MIN_INTERVAL_MS:1100}
    llm-max-retries: ${OLYMPUS_AGENT_LLM_MAX_RETRIES:3}

server:
  port: 8080

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
