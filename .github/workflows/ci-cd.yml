name: CI

# CI du dépôt Olympus : exécute uniquement les tests sur chaque push / PR.
#
# Le DÉPLOIEMENT d'Olympus n'est PAS géré ici : il est assuré par la pipeline du
# dépôt Chiron (.github/workflows/deploy.yml), qui checkout ce dépôt, build le JAR
# backend + la PWA, lance les tests (job `test-olympus`) puis déploie sur le serveur
# (job `deploy-olympus`, modèle « artefacts montés » dans ~/olympus). Inutile donc de
# dupliquer ici un job de déploiement.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Bloque toute clé, token ou mot de passe en clair avant qu'il n'atteigne main — c'est ce
  # contrôle qui manquait quand une clé Mistral réelle a été committée dans .env.example.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: olympus_user
          POSTGRES_PASSWORD: olympus_password
          POSTGRES_DB: olympus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olympus_user -d olympus_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Create PostgreSQL extensions
        run: |
          PGPASSWORD=olympus_password psql -h localhost -U olympus_user -d olympus_db \
            -c 'CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Run tests
        working-directory: olympus-back
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/olympus_db
          SPRING_DATASOURCE_USERNAME: olympus_user
          SPRING_DATASOURCE_PASSWORD: olympus_password
        run: |
          chmod +x mvnw
          ./mvnw -B verify
