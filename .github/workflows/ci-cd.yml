name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------
  # 1. Tests — exécutés sur chaque push et chaque pull request
  # ----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: olympus_user
          POSTGRES_PASSWORD: olympus_password
          POSTGRES_DB: olympus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olympus_user -d olympus_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Create PostgreSQL extensions
        run: |
          PGPASSWORD=olympus_password psql -h localhost -U olympus_user -d olympus_db \
            -c 'CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Run tests
        working-directory: olympus-back
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/olympus_db
          SPRING_DATASOURCE_USERNAME: olympus_user
          SPRING_DATASOURCE_PASSWORD: olympus_password
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  # ----------------------------------------------------------------------
  # 2. Build & push de l'image Docker sur GHCR — uniquement sur main
  # ----------------------------------------------------------------------
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./olympus-back
          file: ./olympus-back/Dockerfile
          push: true
          tags: |
            ghcr.io/kronos131-dev/olympus:latest
            ghcr.io/kronos131-dev/olympus:${{ github.sha }}

  # ----------------------------------------------------------------------
  # 3. Déploiement sur le serveur via SSH — uniquement sur main
  # ----------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/olympus
            git pull --ff-only
            cd olympus-back
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
